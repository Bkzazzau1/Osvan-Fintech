workflows:
  ios-release:
    name: Osvan iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: 3.41.7
      xcode: latest

    scripts:
      - name: Get packages
        script: flutter pub get

      - name: Build iOS release
        script: flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa
