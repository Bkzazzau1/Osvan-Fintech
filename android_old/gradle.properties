## ------------------------------------------------------------
## Osvan Android Gradle properties (Flutter + AGP 8.9.1)
## ------------------------------------------------------------

# JVM memory for Gradle
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError

# AndroidX (required by Flutter plugins)
android.useAndroidX=true
android.enableJetifier=true

# Point Gradle to JDK 17 (update path if your install differs)
org.gradle.java.home=C:\\Program Files\\Java\\jdk-17

# Kotlin stability (optional)
kotlin.code.style=official
kotlin.incremental=false
kotlin.daemon.jvm.options=-Xmx2g
kotlin.daemon.useFallbackStrategy=true

# Gradle performance
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Android build flags
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true

# Lint
android.lint.warningsAsErrors=false
