## ------------------------------------------------------------
## Osvan Android Gradle properties (Flutter + AGP 8.x)
## Keep versions aligned with:
## - Gradle Wrapper: 8.7
## - AGP: 8.4.2 (or 8.6.0 if using Kotlin 2.x)
## - Kotlin Gradle Plugin: 1.9.24 (or 2.0.21 if using AGP 8.6)
## ------------------------------------------------------------

# JVM memory for Gradle (safe toggles)
# Smaller heap + Parallel GC reduces flakiness on some plugin mixes.
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -XX:MaxMetaspaceSize=4g -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# AndroidX migration flags (required by most Flutter plugins)
android.useAndroidX=true
android.enableJetifier=true

# ----- Kotlin stability
kotlin.code.style=official
# Safe toggle: turn off incremental to avoid rare stale-state issues during upgrades
kotlin.incremental=false
# Keep the Kotlin daemon from overgrowing; adjust if you see OOMs
kotlin.daemon.jvm.options=-Xmx2g
kotlin.daemon.useFallbackStrategy=true

# ----- Gradle performance (safe for 8.x)
org.gradle.caching=true
org.gradle.parallel=true
# Safe toggle: disable configuration cache for now (can re-enable later)
org.gradle.configuration-cache=false
# (configure-on-demand is deprecated in newer Gradle; leave it off)

# ----- Android build flags that play nicely with Flutter/AGP 8.x
# Smaller R classes → faster builds
android.nonTransitiveRClass=true
# Ensure BuildConfig.java is generated (explicit even though default is true)
android.defaults.buildfeatures.buildconfig=true

# Lint behavior (tune per policy/CI)
android.lint.warningsAsErrors=false

